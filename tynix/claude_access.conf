# claude_access.conf - which files of this PC the Claude device may use
# (cpu_sim/src/claude.py, Phase 8). Read again before every request, so it
# can be edited while the simulator runs.
#
# tynix/claude/ (Claude's own folder, made on first use) is always allowed,
# to read and to write. Everything else is refused unless a line here says
# otherwise. Whatever Claude reads is sent to Anthropic's API.
#
#   read  PATH     a file, or a folder and everything under it
#   write PATH     the same, and Claude may write there too
#
# ~ is your home folder; a relative path starts in this file's folder
# (tynix/). Symlinks and .. are resolved first, so they can't lead outside.
# Claude can never run anything on the PC.
#
# Examples (remove the # to use one):
# read  ../compiler/c_language.md
# read  ../TECHNICAL.md
# read  ~/Documents/specs/
# write ~/Documents/claude_out/
